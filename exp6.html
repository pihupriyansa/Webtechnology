<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact</title>

<style>
body{
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#a8edea,#fed6e3);
    font-family:'Segoe UI', sans-serif;
}

form{
    background:rgba(255,255,255,0.95);
    padding:35px;
    border-radius:20px;
    box-shadow:0 15px 30px rgba(0,0,0,0.2);
    width:350px;
}

h2{
    text-align:center;
    margin-bottom:20px;
    color:#444;
}

label{
    font-size:14px;
    color:#555;
}

input[type="text"], input[type="number"], input[type="email"]{
    width:100%;
    padding:10px;
    margin-top:6px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:14px;
}

input[type="range"]{
    width:100%;
}

button{
    padding:10px 20px;
    background:#6a5acd;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    margin-top:10px;
}

button:hover{
    background:#5941c9;
}

table{
    margin-top:20px;
    border-collapse:collapse;
    width:350px;
    background:white;
}

th, td{
    padding:10px;
    border:1px solid #ddd;
    text-align:center;
}

th{
    background:#6a5acd;
    color:white;
}
</style>
</head>

<body>

<form id="contactForm">
<h2>Contact Form</h2>

<label><b>Name*</b></label><br>
<input type="text" id="fname" placeholder="First name">
<input type="text" id="lname" placeholder="Last name"><br><br>

<label><b>Age*</b></label><br>
<input type="number" id="age"><br><br>

<label><b>Cool</b></label><br>
<input type="range" id="cool"><br><br>

<label><b>Gender*</b></label><br>
<input type="radio" name="gender" value="Male"> Male
<input type="radio" name="gender" value="Female"> Female<br><br>

<label><b>Email*</b></label><br>
<input type="email" id="email"><br><br>

<label><b>Contact*</b></label><br>
<input type="number" id="contact"><br><br>

<label><b>Address*</b></label><br>
<input type="text" id="address"><br><br>

<label><b>Score*</b></label><br>
<input type="number" id="score"><br><br>

<button type="submit">Submit</button>
<button type="button" onclick="copyData()">Copy</button>

</form>

<table id="outputTable" style="display:none;"></table>

<script>

document.getElementById("contactForm").addEventListener("submit", function(e){
e.preventDefault();

let fname = document.getElementById("fname").value;
let lname = document.getElementById("lname").value;
let age = document.getElementById("age").value;
let cool = document.getElementById("cool").value;
let email = document.getElementById("email").value;
let contact = document.getElementById("contact").value;
let address = document.getElementById("address").value;
let score = document.getElementById("score").value;

let genderElement = document.querySelector('input[name="gender"]:checked');
let gender = genderElement ? genderElement.value : "";

let table = document.getElementById("outputTable");

table.innerHTML = `
<tr><th>Field</th><th>Value</th></tr>
<tr><td>Name</td><td>${fname} ${lname}</td></tr>
<tr><td>Age</td><td>${age}</td></tr>
<tr><td>Cool</td><td>${cool}</td></tr>
<tr><td>Gender</td><td>${gender}</td></tr>
<tr><td>Email</td><td>${email}</td></tr>
<tr><td>Contact</td><td>${contact}</td></tr>
<tr><td>Address</td><td>${address}</td></tr>
<tr><td>Score</td><td>${score}</td></tr>
`;

table.style.display = "table";

});

function copyData(){

let table = document.getElementById("outputTable");
let text = table.innerText;

navigator.clipboard.writeText(text);

alert("Output copied!");
}

</script>

</body>
</html>
